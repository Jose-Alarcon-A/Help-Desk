<mat-toolbar color="primary" class="toolbar">

  <mat-icon>
    dashboard_customize
  </mat-icon>

  <span class="toolbar-title">
    Sistema Help Desk
  </span>

</mat-toolbar>

<mat-sidenav-container class="layout">

  <mat-sidenav mode="side" opened class="sidebar">

    <!-- ===================================================
         CABECERA DEL SIDEBAR
         =================================================== -->

    <div class="sidebar-header">

      <mat-icon>
        headset_mic
      </mat-icon>

      <span class="sidebar-title">
        Help Desk
      </span>

    </div>

    <!-- ===================================================
         TÍTULO DEL MENÚ
         =================================================== -->

    <div class="menu-titulo">
      Menú Principal
    </div>

    <!-- ===================================================
         MENÚ
         =================================================== -->

    <mat-nav-list>

      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="activo"
      >
        <mat-icon matListItemIcon>
          dashboard
        </mat-icon>

        <span matListItemTitle>
          Dashboard
        </span>
      </a>

      <!-- ===================================================
           MENÚ TICKETS (CON SUBMENÚ)
           =================================================== -->

      <div class="menu-grupo">

        <button
          type="button"
          mat-list-item
          class="menu-padre"
          [class.abierto]="menuTicketsAbierto()"
          (click)="alternarMenuTickets()"
        >
          <mat-icon
            matListItemIcon
            class="icono-ticket"
            [class.abierto]="menuTicketsAbierto()"
          >
            confirmation_number
          </mat-icon>

          <span matListItemTitle>
            Tickets
          </span>
        </button>

        @if (menuTicketsAbierto()) {

          <a
            mat-list-item
            class="submenu-item"
            routerLink="/tickets"
            routerLinkActive="activo"
          >
            <span matListItemTitle>
              Listado de tickets
            </span>
          </a>

          <a
            mat-list-item
            class="submenu-item"
            routerLink="/tickets/nuevo"
            routerLinkActive="activo"
          >
            <span matListItemTitle>
              Nuevo Ticket
            </span>
          </a>

        }

      </div>

      <a
        mat-list-item
        routerLink="/usuarios"
        routerLinkActive="activo"
      >
        <mat-icon matListItemIcon>
          people
        </mat-icon>

        <span matListItemTitle>
          Usuarios
        </span>
      </a>

      <a
        mat-list-item
        routerLink="/kanban"
        routerLinkActive="activo"
      >
        <mat-icon matListItemIcon>
          view_kanban
        </mat-icon>

        <span matListItemTitle>
          Kanban
        </span>
      </a>

      <a
        mat-list-item
        routerLink="/reportes"
        routerLinkActive="activo"
      >
        <mat-icon matListItemIcon>
          bar_chart
        </mat-icon>

        <span matListItemTitle>
          Reportes
        </span>
      </a>

      <a
        mat-list-item
        routerLink="/acerca"
        routerLinkActive="activo"
      >
        <mat-icon matListItemIcon>
          info
        </mat-icon>

        <span matListItemTitle>
          Acerca
        </span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>

    <main class="contenedor">

      <router-outlet></router-outlet>

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
