<div class="acciones">

    <a mat-icon-button [routerLink]="['/usuarios/editar', usuario().id]" aria-label="Editar usuario">
        <mat-icon>edit</mat-icon>
    </a>

    <button mat-icon-button type="button" class="eliminar" [disabled]="eliminando()" (click)="solicitarEliminacion()" aria-label="Eliminar usuario">
        <mat-icon>delete</mat-icon>
    </button>

    <a mat-icon-button [routerLink]="['/usuarios', usuario().id]" aria-label="Ver detalle">
        <mat-icon>visibility</mat-icon>
    </a>

</div>
