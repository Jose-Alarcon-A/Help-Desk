<section class="tickets">

    <div class="encabezado">

        <h1>Gestión de Tickets</h1>

        <p>
            Solicitudes registradas en el sistema
        </p>

    </div>

    @if (cargando()) {

        <p class="mensaje">
            Cargando tickets...
        </p>

    }

    @else if (error()) {

        <div class="mensaje error">
            No fue posible obtener los registros
        </div>

    }

    @else {

        <div class="tabla-contenedor">

            <table mat-table [dataSource]="dataSource">

                <ng-container matColumnDef="id">

                    <th mat-header-cell *matHeaderCellDef>
                        ID
                    </th>

                    <td mat-cell *matCellDef="let ticket">
                        #<app-id-ticket [id]="ticket.id"></app-id-ticket>
                    </td>

                </ng-container>

                <ng-container matColumnDef="asunto">

                    <th mat-header-cell *matHeaderCellDef>
                        Asunto
                    </th>

                    <td mat-cell *matCellDef="let ticket">
                        {{ ticket.asunto }}
                    </td>

                </ng-container>

                <ng-container matColumnDef="estado">

                    <th mat-header-cell *matHeaderCellDef>
                        Estado
                    </th>

                    <td mat-cell *matCellDef="let ticket">

                        <app-estado-ticket  [estado]="ticket.estado">
                        </app-estado-ticket>

                    </td>

                </ng-container>

                <ng-container matColumnDef="prioridad">

                    <th mat-header-cell *matHeaderCellDef>
                        Prioridad
                    </th>

                    <td mat-cell *matCellDef="let ticket">

                        <app-prioridad-ticket  [prioridad]="ticket.prioridad">
                        </app-prioridad-ticket>

                    </td>

                </ng-container>

                <ng-container matColumnDef="fechaCreacion">

                    <th mat-header-cell *matHeaderCellDef>
                        Fecha
                    </th>

                    <td mat-cell *matCellDef="let ticket">
                        {{ ticket.fechaCreacion | date:'dd/MM/yyyy' }}
                    </td>

                </ng-container>

                <ng-container matColumnDef="acciones">

                    <th mat-header-cell *matHeaderCellDef>
                        Acciones
                    </th>

                    <td mat-cell *matCellDef="let ticket">

                      <app-acciones-ticket [ticket]="ticket" [eliminando]="eliminandoId() === ticket.id" (eliminar)="eliminar($event)"></app-acciones-ticket>

                    </td>

                </ng-container>


                <tr
                    mat-header-row
                    *matHeaderRowDef="columnas">
                </tr>


                <tr
                    mat-row
                    *matRowDef="let row; columns: columnas;">
                </tr>


            </table>

            <mat-paginator
                [pageSize]="5"
                [pageSizeOptions]="[5, 10, 20]"
                showFirstLastButtons>
            </mat-paginator>

        </div>

    }

</section>
