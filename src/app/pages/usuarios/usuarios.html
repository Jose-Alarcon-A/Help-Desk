<section class="usuarios">

    <div class="encabezado">

        <h1>Gestión de Usuarios</h1>

        <p>
            Usuarios registrados en el sistema
        </p>

    </div>


    @if (cargando()) {

        <p class="mensaje">
            Cargando usuarios...
        </p>

    }

    @else if (error()) {

        <div class="mensaje error">
            No fue posible obtener los registros
        </div>

    }

    @else {

        <div class="tabla-contenedor">

            <table mat-table [dataSource]="dataSource">


                <ng-container matColumnDef="id">

                    <th mat-header-cell *matHeaderCellDef>
                        ID
                    </th>

                    <td mat-cell *matCellDef="let usuario">
                        #{{ usuario.id }}
                    </td>

                </ng-container>


                <ng-container matColumnDef="nombre">

                    <th mat-header-cell *matHeaderCellDef>
                        Nombre
                    </th>

                    <td mat-cell *matCellDef="let usuario">
                        {{ usuario.nombre }}
                    </td>

                </ng-container>


                <ng-container matColumnDef="correo">

                    <th mat-header-cell *matHeaderCellDef>
                        Correo
                    </th>

                    <td mat-cell *matCellDef="let usuario">
                        {{ usuario.correo }}
                    </td>

                </ng-container>


                <ng-container matColumnDef="rol">

                    <th mat-header-cell *matHeaderCellDef>
                        Rol
                    </th>

                    <td mat-cell *matCellDef="let usuario">

                        <span
                            class="rol"
                            [class.rol-administrador]="usuario.rol === 'Administrador'"
                            [class.rol-soporte]="usuario.rol === 'Soporte'"
                            [class.rol-usuario]="usuario.rol === 'Usuario'"
                        >
                            {{ usuario.rol }}
                        </span>

                    </td>

                </ng-container>


                <ng-container matColumnDef="acciones">

                    <th mat-header-cell *matHeaderCellDef>
                        Acciones
                    </th>

                    <td mat-cell *matCellDef="let usuario">

                      <button mat-icon-button [routerLink]="['/usuarios/editar', usuario.id]" aria-label="Editar Usuario">
                        <mat-icon>edit </mat-icon>
                      </button>

                      <button mat-icon-button type="button" class="eliminar" [disabled]="eliminandoId() === usuario.id" (click)="eliminarUsuario(usuario)" aria-label="Eliminar usuario">
                        <mat-icon>delete</mat-icon>
                      </button>

                      <a mat-icon-button [routerLink]="['/usuarios', usuario.id]" aria-label="Ver Detalle">
                        <mat-icon>visibility</mat-icon>
                      </a>

                    </td>

                </ng-container>


                <tr
                    mat-header-row
                    *matHeaderRowDef="columnas">
                </tr>


                <tr
                    mat-row
                    *matRowDef="let row; columns: columnas;">
                </tr>


            </table>


            <mat-paginator
                [pageSize]="5"
                [pageSizeOptions]="[5, 10, 20]"
                showFirstLastButtons>
            </mat-paginator>

        </div>

    }

</section>
