<section class="columna">
    <header class="columna-encabezado">
        <h2>{{ titulo() }}</h2>
        <span class="cantidad">
            {{ tickets().length }}
        </span>
    </header>

    <div class="columna-contenido" cdkDropList [cdkDropListData]="tickets()" (cdkDropListDropped)="soltarTicket($event)">
        @for (ticket of tickets(); track ticket.id) {
          <div class="tarjeta-arrastable" cdkDrag [cdkDragData]="ticket">
            <app-tarjeta-ticket
              [ticket]="ticket"
              (cambiarEstado)="cambiarEstado.emit($event)"
            />
          </div>
        } @empty {
          <p class="mensaje-vacio">No hay tickets registrados</p>
        }
    </div>
</section>
